<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
</head>
<body>
  <h1>Register</h1>

  <form>
    <label for="nom">Nom :</label><br>
    <input type="text" id="nom" name="nom" placeholder="Votre nom" required><br><br>

    <label for="email">Email :</label><br>
    <input type="email" id="email" name="email" placeholder="Votre email" required><br><br>

    <label for="password">Mot de passe :</label><br>
    <input type="password" id="password" name="password" placeholder="Votre mot de passe" required><br><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
